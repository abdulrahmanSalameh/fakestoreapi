<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Fake Store</h1>

        <nav>
            <a href="index.html">Products</a>
            <a href="add-product.html">Add Product</a>
        </nav>

    </header>


    <section class="firebase-section">

        <h2>Add Product</h2>


        <form id="productForm">

            <input
                type="text"
                id="productTitle"
                placeholder="Product Title"
                required
            >

            <input
                type="number"
                id="productPrice"
                placeholder="Product Price"
                required
            >

            <textarea
                id="productDescription"
                placeholder="Product Description"
                required
            ></textarea>

            <input
                type="text"
                id="productImage"
                placeholder="Image URL"
                required
            >

            <button type="submit">
                Add Product
            </button>

        </form>

    </section>


    <footer>
        <p>Fake Store API</p>
    </footer>


    <script type="module" src="add-product.js"></script>

</body>

</html>
